<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0" x2="1">
      <stop offset="0%" stop-color="#FFE799"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
  <!-- Dark background -->
  <rect width="100%" height="100%" fill="#070707"/>
  
  <!-- Gold gradient circle with better centering -->
  <circle cx="256" cy="256" r="150" fill="url(#grad)" opacity="0.12"/>
  
  <!-- Centered CAZ text -->
  <text x="256" y="280" text-anchor="middle" dominant-baseline="middle" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="120" fill="#D4AF37">CAZ</text>
</svg>